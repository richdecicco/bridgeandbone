<style>
  :root {
    --gold: #AC8340; --gold-light: #CBA666; --gold-dim: #6F5530;
    --cream: #EFE6D2; --wood: #3A2417; --velvet: #4A1420;
    --bg: #120C0A; --ink: #20140E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--cream);
    font-family: "Libre Caslon Text", Georgia, serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    position: relative; overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: url("/swr-hero.jpg") center / cover no-repeat;
    filter: blur(18px) saturate(0.9); transform: scale(1.1); opacity: 0.45;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(18,12,10,0.55) 0%, rgba(18,12,10,0.92) 70%);
  }
  main {
    position: relative; z-index: 2; width: 100%; max-width: 400px; text-align: center;
  }
  .cover {
    width: 60%; max-width: 240px; margin: 0 auto; aspect-ratio: 1 / 1; border-radius: 4px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6); border: 1px solid var(--gold-dim);
    background: var(--ink) url("/swr-hero.jpg") center / cover no-repeat;
  }
  .eyebrow {
    font-family: "Archivo", system-ui, sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold-light); margin-top: 20px;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 40px; line-height: 1.05; margin-top: 6px; color: var(--cream);
  }
  .artist {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: 21px; color: var(--gold-light); margin-top: 4px;
  }
  .services { list-style: none; margin-top: 22px; display: grid; gap: 8px; }
  .svc {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 18px; border-radius: 4px; text-decoration: none;
    background: rgba(32,20,14,0.85); border: 1px solid var(--gold-dim); color: var(--cream);
    font-family: "Archivo", system-ui, sans-serif; font-weight: 500; font-size: 15px;
    transition: border-color .15s, background .15s;
  }
  .svc:hover, .svc:focus-visible { border-color: var(--gold-light); background: rgba(74,20,32,0.85); outline: none; }
  .svc .cta {
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--bg); background: var(--gold); padding: 7px 12px; border-radius: 3px;
  }
  .svc:hover .cta { background: var(--gold-light); }
  .svc.primary { border-color: var(--gold); }
  footer {
    margin-top: 28px; font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-size: 16px; color: var(--gold-light); opacity: 0.85;
  }
  footer a {
    display: inline-block; margin-top: 10px; font-family: "Archivo", system-ui, sans-serif;
    font-style: normal; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--cream); opacity: 0.6; text-decoration: none;
  }
  footer a:hover { opacity: 1; }

<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main>
    <div class="cover" role="img" aria-label="Still We Rise cover art"></div>
    <p class="eyebrow">New Single &middot; Out Now</p>
    <h1 id="song">Still We Rise</h1>
    <p class="artist">Bridge and Bone</p>

    <ul class="services" id="services"></ul>

    <footer>
      Rhythms for the bones, lyrics for the soul.<br>
      <a href="/">bridgeandbone.com</a>
    </footer>
  </main>

<script>
(function () {
  var c = window.BB;
  document.getElementById("song").textContent = c.song;

  var list = document.getElementById("services");
  c.services.filter(function (s) { return s.url; }).forEach(function (s, i) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "svc" + (i === 0 ? " primary" : "");
    a.href = s.url;
    a.rel = "noopener";
    a.textContent = s.name + " ";
    var cta = document.createElement("span");
    cta.className = "cta";
    cta.textContent = s.cta;
    a.appendChild(cta);
    li.appendChild(a);
    list.appendChild(li);

    var svc = s.id, url = s.url;

    a.addEventListener("click", function (e) {
      // Let cmd/ctrl/middle clicks open normally
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) { fire(svc); return; }
      e.preventDefault();
      var gone = false;
      function go() { if (gone) return; gone = true; window.location.href = url; }
      fire(svc, go);
      setTimeout(go, 700); // never strand a fan if a tag is slow or blocked
    });
  });

  function fire(svc, cb) {
    if (window.gtag && c.googleAdsId && c.googleAdsLabel) {
      gtag("event", "conversion", {
        send_to: c.googleAdsId + "/" + c.googleAdsLabel,
        event_callback: cb
      });
      gtag("event", "stream_click", { service: svc, song: c.song });
    }
    if (window.ttq && c.tiktokPixelId) {
      ttq.track("ClickButton", { content_id: svc, content_name: c.song });
    }
  }
})();
</script>
</body>
